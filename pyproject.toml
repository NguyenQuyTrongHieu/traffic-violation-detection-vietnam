[project]
name = "traffic-violation-detection-vietnam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "onnxruntime==1.31.1",
    "opencv-python>=5.0.0.93",
    "paddleocr>=3.4.1",
    "paddlepaddle==3.2.0",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ultralytics>=8.4.201",
]

[project.scripts]
traffic-violation-detection-vietnam = "traffic_violation_detection_vietnam:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
